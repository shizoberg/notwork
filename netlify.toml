[build]
  command = "npm run build"
  publish = "dist"

# Nodes moved to its own domain. Keep deep links and avoid duplicate copies.
[[redirects]]
  from = "/nodes2"
  to = "https://nodes-app.com/"
  status = 301
  force = true

[[redirects]]
  from = "/nodes2/*"
  to = "https://nodes-app.com/:splat"
  status = 301
  force = true
