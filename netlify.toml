[build]
  command = "npm run build"
  publish = "dist"

# Unlisted Nodes preview: crawlers must be allowed to read the noindex rule.
[[headers]]
  for = "/nodes2"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/nodes2/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/nodes2"
  to = "/nodes2/"
  status = 301
